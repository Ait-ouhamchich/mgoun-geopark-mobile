workflows:
  ios-workflow:
    name: iOS Build and Submit to TestFlight
    max_build_duration: 120
    environment:
      xcode: latest
      node: 18.13.0
      vars:
        EXPO_TOKEN: $EXPO_TOKEN
    triggering:
      events:
        - push
    scripts:
      - name: Install dependencies
        script: |
          npm install -g eas-cli
          npm install
          pnpm install
      - name: Build iOS app with EAS
        script: |
          export EXPO_TOKEN=$EXPO_TOKEN
          eas build --platform ios --non-interactive --wait
    artifacts:
      - build/ios/**/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
